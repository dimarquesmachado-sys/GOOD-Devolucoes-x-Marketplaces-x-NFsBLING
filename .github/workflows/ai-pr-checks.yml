# .github/workflows/ai-pr-checks.yml
#
# O check `ai-safety` — o portao que o auto-merge exige verde.
#
# NAO e o `scripts/verifica.js` (que esta falhando na main por outro
# motivo, e o dono mandou nao mexer). Este roda a bateria de testes do
# repo e o boot real, que e o que pega os erros que realmente aparecem em
# producao: TDZ, variavel fora de escopo, modulo nao importado.

name: ai-pr-checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write

jobs:
  ai-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # b749 (T-05, auditoria do Codex 15/11): a versao do Node vem do `.nvmrc` — o mesmo arquivo que o
      # `test/lockfile-estrito.test.js` confere contra `engines` do package.json. Um lugar so.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # b212: `npm install`, sem depender do package-lock — o lock NAO estava no repositorio e `npm ci`
      # falhava no runner com EUSAGE, com o passo seguindo como se tivesse instalado.
      # b749 (T-05): o lock ESTA no repositorio (lockfileVersion 3, mantido nos P2-17a/b/c). Agora a instalacao e
      # ESTRITA: `npm ci` instala exatamente o que o lock diz e falha se package.json e lock divergirem — assim o
      # runner roda o que o dono roda, e nenhum pacote entra fora do lock (o `node-fetch@^2 --no-save` que vinha
      # aqui nao e exigido por nenhum arquivo do repo; saiu).
      - name: Instalar as dependencias (estrito pelo lockfile)
        run: |
          set -e
          npm ci --no-audit --no-fund || { echo "npm ci FALHOU: package.json e package-lock.json divergem, ou o lock nao resolve"; exit 1; }
          echo "instalados:"
          node -e "
            const p = require('./package.json');
            for (const d of Object.keys(p.dependencies || {})) {
              try { require.resolve(d); console.log('  ok  ' + d); }
              catch { console.log('  FALTA ' + d); process.exitCode = 1; }
            }
          "

      - name: Sintaxe
        run: |
          for f in server.js amb-devolucoes/app-AMB.js lib/*.js; do
            node --check "$f" || exit 1
          done
          echo "sintaxe ok"

      - name: Bateria de testes
        run: |
          FALHOU=0
          QUEBRARAM=""
          for t in test/*.test.js; do
            printf "  %-34s " "$(basename $t)"
            if node "$t" > /tmp/o.txt 2>&1; then
              tail -1 /tmp/o.txt
            else
              echo "FALHOU"
              QUEBRARAM="$QUEBRARAM $(basename $t)"
              # b211: as 20 ultimas linhas, nao 5 — stack de require aparece
              # inteiro e da pra ver se e erro de codigo ou de ambiente
              sed 's/^/        /' /tmp/o.txt | tail -20
              FALHOU=1
            fi
          done
          if [ $FALHOU -ne 0 ]; then
            echo ""
            echo "=== quebraram:$QUEBRARAM"
          fi
          exit $FALHOU

      - name: Boot real
        env:
          ADMIN_KEY: teste
          PORT: '0'
        run: |
          timeout 30 node -e "
            try {
              require('./server.js');
              setTimeout(() => { console.log('BOOT OK'); process.exit(0); }, 5000);
            } catch (e) { console.log('BOOT FALHOU:', e.message); process.exit(1); }
          "
