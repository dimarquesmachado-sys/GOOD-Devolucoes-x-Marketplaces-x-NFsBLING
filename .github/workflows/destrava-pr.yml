# .github/workflows/destrava-pr.yml
#
# ⚠️ POR QUE ISTO EXISTE
#
# [stated] "não tem como automatizar isso? pra eu não ter q ficar vindo aqui
# e falar, olha deu erro, tá unable"
#
# Em 10/09 o dono avisou "unable" umas 15 vezes, e MEDINDO a causa:
#
#   conversas pendentes .......... ~8x   ← mecanico
#   branch atras da main ......... ~2x   ← mecanico
#   check `ciclo` vermelho ....... ~5x   ← ja resolvido (continue-on-error)
#   apontamento real ............. varias ← trabalho do Claude, ja funciona
#   conflito de CONTEUDO ......... 1x    ← precisa de gente
#
# Uns 80% eram mecanicos: o Codex ja tinha revisado, nao havia apontamento
# novo, e THREADS ANTIGAS seguravam o merge. Nenhum julgamento envolvido —
# so alguem clicando "resolve" 27 vezes.
#
# ⚠️ O QUE ESTE WORKFLOW **NAO** FAZ, DE PROPOSITO:
#
#   - NAO MERGEIA. Regra da casa: quem mergeia e o dono, sempre.
#   - NAO resolve conflito de CONTEUDO. Isso e julgamento: escolher um lado
#     apaga trabalho do outro. Ele ETIQUETA e para.
#   - NAO resolve thread se houver apontamento NOVO sem tratar. Seria
#     esconder trabalho pendente — o oposto do que serve.

name: destrava-pr

on:
  # depois que o Codex termina de revisar
  pull_request_review:
    types: [submitted]
  # e quando a main anda (a branch pode ter ficado atras)
  push:
    branches: [main]
  # ⚠️ E QUANDO QUALQUER BRANCH DE PR RECEBE PUSH.
  #
  # Motivo medido: em 10/09 o dono avisou "unable" TRES VEZES seguidas
  # (#225, #226, #228) pelo mesmo motivo — eu subo a correcao DEPOIS da
  # ultima revisao do Codex, entao nao ha `pull_request_review` novo e este
  # workflow nunca acorda. As conversas antigas ficam segurando o merge, e
  # so um humano percebe.
  #
  # Com `synchronize`, todo push num PR aberto re-avalia: se nao ha
  # apontamento novo (a trava do passo 1 cuida disso), destrava sozinho.
  pull_request:
    types: [synchronize, reopened]
  # e sob demanda
  workflow_dispatch:
    inputs:
      pr:
        description: 'Numero do PR (vazio = todos os abertos)'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: destrava-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  destravar:
    # ⚠️ NUNCA bloquear. Este workflow existe pra DESTRAVAR — se ele proprio
    # travar o PR, fica pior que nao existir.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Destravar o que for mecanico
        # b736 (P2-13, auditoria do Codex 15/11): o PASSO falha quando nao consegue nem perguntar ao GitHub
        # (`exit 1` + ::error::), pra aparecer vermelho no log; o JOB segue `continue-on-error`, entao o PR
        # nunca e bloqueado por este workflow. Antes: `gh pr list` sem repositorio (nao ha checkout) dava
        # "fatal: not a git repository", a lista vinha vazia, o loop nao rodava e o job ficava VERDE sem operar.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ⚠️ nao ha `actions/checkout` aqui (de proposito: so chamadas de API) — entao TODO `gh` precisa saber
          # o repositorio por este env, senao ele procura um .git que nao existe
          GH_REPO: ${{ github.repository }}
        run: |
          set +e   # nenhum passo do LOOP pode derrubar o job; so a falta de acesso ao GitHub (abaixo) falha o passo

          if [ -z "$GH_REPO" ]; then
            echo "::error::GH_REPO vazio — nenhum gh funcionaria sem repositorio"
            exit 1
          fi

          ALVO="${{ github.event.pull_request.number || github.event.inputs.pr }}"
          if [ -n "$ALVO" ]; then
            PRS="$ALVO"
          else
            PRS=$(gh pr list --repo "$GH_REPO" --state open --json number --jq '.[].number' 2>/tmp/erro-gh)
            if [ $? -ne 0 ]; then
              echo "::error::nao consegui listar os PRs abertos: $(cat /tmp/erro-gh)"
              exit 1
            fi
          fi
          if [ -z "$PRS" ]; then
            echo "ℹ️  nenhum PR aberto — nada a fazer (isso NAO e erro)"
            exit 0
          fi
          ERROS=0

          for PR in $PRS; do
            echo "════════ PR #$PR ════════"

            # ── 1) ha apontamento NOVO, depois do ultimo commit? ─────────
            #
            # ⚠️ ESTA E A TRAVA MAIS IMPORTANTE DESTE ARQUIVO. Se o Codex
            # apontou algo depois do ultimo push, ha TRABALHO PENDENTE —
            # resolver as threads aqui esconderia isso, e o PR seria
            # mergeado com apontamento por tratar.
            # b739 (P2-16, auditoria do Codex 15/11): ERRO DE CONSULTA NAO E "ZERO APONTAMENTO". Antes
            # `NOVOS=${NOVOS:-0}` transformava falha do gh (rate limit, permissao) em "nada novo" e o passo 4
            # resolvia todas as threads por cima. Agora: consulta falhando = pula o PR com ::error::.
            ULT_COMMIT=$(gh pr view "$PR" --repo "$GH_REPO" --json commits \
                          --jq '.commits[-1].committedDate' 2>/tmp/erro-gh)
            if [ $? -ne 0 ] || [ -z "$ULT_COMMIT" ]; then
              echo "::error::PR #$PR: nao consegui ler o ultimo commit ($(cat /tmp/erro-gh)) — nao mexo"
              ERROS=$((ERROS+1)); continue
            fi
            NOVOS=$(gh api "repos/$GH_REPO/pulls/$PR/comments?per_page=100" \
                     --jq "[.[] | select(.user.login|startswith(\"chatgpt\")) | select(.created_at > \"$ULT_COMMIT\")] | length" 2>/tmp/erro-gh)
            if [ $? -ne 0 ] || ! [ "$NOVOS" -ge 0 ] 2>/dev/null; then
              echo "::error::PR #$PR: nao consegui ler os apontamentos ($(cat /tmp/erro-gh)) — nao mexo"
              ERROS=$((ERROS+1)); continue
            fi

            if [ "$NOVOS" -gt 0 ]; then
              echo "  ⏭️  $NOVOS apontamento(s) novo(s) sem tratar — NAO mexo."
              echo "     (o Claude do ciclo cuida disso; resolver thread aqui esconderia)"
              continue
            fi

            # ── 2) a branch esta atras da main? ──────────────────────────
            #
            # `update-branch` faz o merge da main na branch. Se der conflito
            # de CONTEUDO, o GitHub recusa — e ai e caso de gente.
            ESTADO=$(gh pr view "$PR" --repo "$GH_REPO" --json mergeStateStatus --jq '.mergeStateStatus' 2>/dev/null)
            if [ "$ESTADO" = "BEHIND" ]; then
              echo "  🔄 branch atras da main — atualizando"
              gh api -X PUT "repos/${{ github.repository }}/pulls/$PR/update-branch" >/dev/null 2>&1 \
                && echo "     ✅ atualizada (⚠️ isso REABRE as threads; resolvo abaixo)" \
                || echo "     ⚠️ nao consegui — provavelmente conflito de conteudo"
              sleep 5
            fi

            # ── 3) conflito de CONTEUDO: etiqueta e PARA ─────────────────
            #
            # ⚠️ NAO tento resolver. Escolher um lado apaga trabalho do
            # outro — hoje mesmo o conflito era a linha de versao, e a
            # resolucao certa era JUNTAR as duas descricoes, nao escolher.
            # Isso e julgamento.
            ESTADO=$(gh pr view "$PR" --repo "$GH_REPO" --json mergeStateStatus --jq '.mergeStateStatus' 2>/dev/null)
            if [ "$ESTADO" = "DIRTY" ]; then
              echo "  ⛔ CONFLITO DE CONTEUDO — isso precisa de gente"
              gh pr edit "$PR" --repo "$GH_REPO" --add-label "conflito" >/dev/null 2>&1
              gh pr comment "$PR" --repo "$GH_REPO" --body "⛔ **Conflito com a \`main\`.** Não resolvo automaticamente: escolher um lado apaga trabalho do outro. Precisa de revisão." >/dev/null 2>&1
              continue
            fi

            # ── 4) resolver SO as conversas COM PROVA de tratamento ──────
            #
            # b739 (P2-16): antes resolvia TODAS as abertas "por contagem" (zero apontamento novo = tudo
            # tratado). Prova de tratamento de uma thread e: (a) alguem que NAO e o Codex respondeu nela
            # DEPOIS do apontamento (o "Tratado em <sha>"), ou (b) a thread ficou `isOutdated` (o trecho
            # apontado mudou num commit posterior). Thread aberta SEM prova fica aberta e e listada.
            # Consulta falhando = nao resolve nada e marca erro.
            THREADS=$(gh api graphql -f query='
              query($owner:String!,$repo:String!,$pr:Int!){
                repository(owner:$owner,name:$repo){
                  pullRequest(number:$pr){
                    reviewThreads(first:100){ nodes{ id isResolved isOutdated comments(first:50){ nodes{ author{ login } createdAt } } } }
                  }
                }
              }' -F owner="${GH_REPO%%/*}" \
                 -F repo="${GH_REPO##*/}" \
                 -F pr="$PR" \
                 --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved==false)
                       | (.comments.nodes[0].createdAt) as $t0
                       | (.comments.nodes[0].author.login // "") as $autor
                       | ([.comments.nodes[1:][] | select((.author.login // "") != $autor and (.author.login // "" | startswith("chatgpt") | not) and .createdAt > $t0)] | length) as $respostas
                       | "\(.id) \(if (.isOutdated or $respostas > 0) then "prova" else "sem-prova" end)"' 2>/tmp/erro-gh)
            if [ $? -ne 0 ]; then
              echo "::error::PR #$PR: nao consegui ler as conversas ($(cat /tmp/erro-gh)) — nao resolvo nada"
              ERROS=$((ERROS+1)); continue
            fi

            N=0; SEM=0
            while read -r ID PROVA; do
              [ -z "$ID" ] && continue
              if [ "$PROVA" != "prova" ]; then SEM=$((SEM+1)); echo "  ⏸️  conversa $ID aberta SEM prova de tratamento — fica aberta"; continue; fi
              gh api graphql -f query='
                mutation($id:ID!){ resolveReviewThread(input:{threadId:$id}){ thread{ isResolved } } }' \
                -F id="$ID" >/dev/null 2>&1 && N=$((N+1))
            done <<< "$THREADS"
            [ "$N" -gt 0 ] && echo "  ✅ $N conversa(s) resolvida(s) (com prova)"
            [ "$SEM" -gt 0 ] && echo "  ⚠️ $SEM conversa(s) sem prova seguem abertas"

            # ── 4b) ⚠️ RE-DISPARA O CICLO QUANDO A MAIN MUDOU ───────────
            #
            # Aconteceu DUAS VEZES em 10/09: o conserto do workflow entra na
            # main DEPOIS da ultima revisao do Codex, e o PR fica pendurado
            # esperando um gatilho que nao vem. Numa delas foram 50 MINUTOS
            # de PR parado, e o dono teve que avisar.
            #
            # A causa e do desenho: o ciclo so acorda com push novo ou
            # revisao nova. E workflow novo so vale da execucao SEGUINTE em
            # diante — entao consertar a permissao nao re-roda nada sozinho.
            #
            # ⚠️ SO EM `push` NA MAIN, e so quando NAO ha apontamento novo
            # (o `continue` la em cima ja cuidou disso). Se a main mudou, pode
            # ser justamente um conserto que o robo precisa conhecer.
            #
            # ⚠️ E NUNCA em evento de PR: viraria loop — o ciclo comita, o
            # commit dispara `synchronize`, que re-dispara o ciclo.
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "  🔄 a main mudou — re-disparo o ciclo neste PR"
              gh workflow run auto-merge-codex.yml --repo "$GH_REPO" -f pr="$PR" >/dev/null 2>&1 \
                && echo "     ✅ ciclo re-disparado" \
                || echo "     ⚠️ nao consegui re-disparar (segue o fluxo normal)"
            fi

            # ── 5) e avisa se ficou pronto ───────────────────────────────
            #
            # ⚠️ So comenta se MUDOU alguma coisa — senao vira spam a cada
            # push, e aviso que sempre aparece para de ser lido.
            FINAL=$(gh pr view "$PR" --repo "$GH_REPO" --json mergeStateStatus --jq '.mergeStateStatus' 2>/dev/null)
            if [ "$FINAL" = "CLEAN" ] && [ "$N" -gt 0 ]; then
              gh pr comment "$PR" --repo "$GH_REPO" --body "✅ **Pronto pra merge.** Destravei o que era mecânico ($N conversa(s) de rodadas anteriores, cada uma com resposta ou trecho já alterado). Zero apontamento sem tratar." >/dev/null 2>&1
              echo "  🔔 PR #$PR pronto — avisado"
            fi
          done

          # b739: consulta que falhou em algum PR = passo vermelho (o job segue continue-on-error: nao bloqueia)
          if [ "${ERROS:-0}" -gt 0 ]; then echo "::error::$ERROS PR(s) com consulta falhando — nada foi decidido neles"; exit 1; fi
          exit 0
