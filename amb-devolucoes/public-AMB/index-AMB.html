<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a0b2e">
<title>AMBTotal - Devolucoes</title>

<link rel="icon" type="image/png" href="icone-AMB.png">
<link rel="apple-touch-icon" href="icone-AMB.png">
<link rel="manifest" href="manifest-AMB.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Devolucoes AMB">
<!--
  =========================================================
  amb-devolucoes/public-AMB/index-AMB.html   (AMB Devol. b11)
  ---------------------------------------------------------
  Tela de triagem do galpao da AMBTotal.

  NOME COM SUFIXO -AMB de proposito: no mesmo repositorio ja
  existe o index.html da GOOD, e os dois se confundiam na
  pasta de Downloads.

  b9 — parte visual: logo da marca, favicon, icone de app
  (da pra "adicionar a tela de inicio" no celular e abrir
  como aplicativo), cores tiradas do proprio logo, e layout
  que usa a tela larga do desktop em vez de uma coluna fina
  no meio.

  Continua SEM biblioteca externa: carrega em rede ruim de
  galpao e nao quebra quando um CDN sai do ar.
  =========================================================
-->
<style>
  :root {
    --roxo:        #561A9E;
    --roxo-claro:  #7B3FC4;
    --magenta:     #9F1254;
    --laranja:     #FD8B00;
    --laranja-cl:  #FFB55F;
    --fundo:       #150a24;
    --painel:      #1e1033;
    --borda:       #35204f;
    --texto:       #f0e9f7;
    --apagado:     #a992c4;
    --verde:       #2ea043;
    --vermelho:    #e5484d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fundo);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(86,26,158,.55), transparent),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(159,18,84,.25), transparent);
    background-attachment: fixed;
    color: var(--texto);
    font-size: 16px;  /* 16px evita o zoom automatico do iOS no input */
  }

  /* ---------- topo ---------- */
  .topo {
    position: sticky; top: 0; z-index: 20;
    background: rgba(30,16,51,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--borda);
    padding: 10px 16px; display: flex; align-items: center; gap: 10px;
  }
  .topo img { width: 34px; height: 34px; border-radius: 8px; }
  .topo .titulo { flex: 1; line-height: 1.15; }
  .topo .titulo b { font-size: 15px; display: block; }
  .topo .titulo span { font-size: 11px; color: var(--apagado); }
  .quem {
    font-size: 12px; color: var(--apagado);
    background: rgba(86,26,158,.35); padding: 5px 10px; border-radius: 20px;
    white-space: nowrap;
  }
  .sair { background: none; border: none; color: var(--apagado);
          font-size: 13px; cursor: pointer; padding: 6px; }

  /* ---------- layout ---------- */
  .area { padding: 16px; max-width: 640px; margin: 0 auto; }
  .colunas { display: block; }

  /* No desktop a tela e larga: bipe de um lado, resultado do
     outro, sem obrigar a rolar. No celular vira uma coluna so. */
  @media (min-width: 900px) {
    .area { max-width: 1100px; padding: 24px; }
    .colunas { display: grid; grid-template-columns: 380px 1fr; gap: 24px; align-items: start; }
    #blocoBipe { position: sticky; top: 80px; }
  }

  /* ---------- formulario ---------- */
  input, button, select, textarea { font-family: inherit; font-size: 16px; }
  .campo {
    width: 100%; padding: 15px; border-radius: 12px;
    border: 2px solid var(--borda); background: rgba(0,0,0,.28);
    color: var(--texto); margin-bottom: 10px; transition: border-color .15s;
  }
  .campo::placeholder { color: #7d6494; }
  .campo:focus { outline: none; border-color: var(--laranja); }
  .bipe { font-size: 21px; text-align: center; letter-spacing: 1px; font-weight: 600; }

  .btn {
    width: 100%; padding: 15px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--laranja), #f2650a);
    color: #fff; font-weight: 700; font-size: 17px; cursor: pointer;
    margin-bottom: 10px; box-shadow: 0 3px 14px rgba(253,139,0,.28);
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; box-shadow: none; }
  .btn.roxo   { background: linear-gradient(135deg, var(--roxo-claro), var(--roxo)); box-shadow: 0 3px 14px rgba(86,26,158,.35); }
  .btn.cinza  { background: rgba(255,255,255,.07); box-shadow: none; }
  .btn.verde  { background: linear-gradient(135deg, #3fb950, var(--verde)); box-shadow: 0 3px 14px rgba(46,160,67,.28); }
  .btn.verm   { background: linear-gradient(135deg, #f0666b, var(--vermelho)); box-shadow: 0 3px 14px rgba(229,72,77,.28); }
  .btn.peq    { padding: 9px 14px; font-size: 14px; width: auto; margin: 0; box-shadow: none; }

  /* ---------- blocos ---------- */
  .card {
    background: var(--painel); border: 1px solid var(--borda);
    border-radius: 14px; padding: 16px; margin-bottom: 12px;
  }
  .card h2 { font-size: 15px; margin: 0 0 10px; display: flex;
             align-items: center; gap: 8px; flex-wrap: wrap; }
  .linha { display: flex; justify-content: space-between; gap: 12px;
           padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
  .linha:last-child { border-bottom: none; }
  .linha .rot { color: var(--apagado); flex-shrink: 0; }
  .linha .val { text-align: right; word-break: break-word; font-weight: 500; }

  .alerta { border-radius: 14px; padding: 15px; margin-bottom: 12px;
            border-left: 5px solid; font-size: 15px; line-height: 1.5; }
  .alerta.vermelho { background: rgba(229,72,77,.14);  border-color: var(--vermelho); }
  .alerta.amarelo  { background: rgba(253,139,0,.14);  border-color: var(--laranja); }
  .alerta.azul     { background: rgba(86,26,158,.28);  border-color: var(--roxo-claro); }
  .alerta b { display: block; margin-bottom: 6px; font-size: 15px; }

  .selo { display: inline-block; padding: 3px 10px; border-radius: 20px;
          font-size: 12px; font-weight: 700; background: rgba(255,255,255,.1); }
  .selo.ml     { background: rgba(255,224,0,.16);  color: #ffe066; }
  .selo.tiktok { background: rgba(233,30,140,.18); color: #ff7ac0; }
  .selo.shopee { background: rgba(253,139,0,.18);  color: var(--laranja-cl); }
  .selo.magalu { background: rgba(56,139,253,.18); color: #79c0ff; }

  .cand { background: rgba(0,0,0,.22); border: 1px solid var(--borda);
          border-radius: 12px; padding: 13px; margin-bottom: 8px; }
  .cand .nome { font-weight: 600; margin-bottom: 3px; }
  .cand .meta { font-size: 13px; color: var(--apagado); }
  .cand .acoes { display: flex; gap: 8px; margin-top: 10px; }
  .itens { margin-top: 10px; padding-top: 10px;
           border-top: 1px dashed var(--borda); font-size: 13px; }
  .itens div { padding: 3px 0; }

  .aviso { font-size: 13px; color: var(--apagado); margin: 12px 0; line-height: 1.55; }
  .erro { color: #ff8085; } .ok { color: #56d364; }
  .esconde { display: none !important; }
  #camera { width: 100%; border-radius: 12px; margin-bottom: 10px; background: #000; }

  /* ---------- login ---------- */
  .login-caixa { max-width: 380px; margin: 0 auto; padding: 40px 20px 20px; text-align: center; }
  .login-caixa img.logo { width: 210px; max-width: 68vw; margin-bottom: 8px; }
  .login-caixa h1 { font-size: 19px; margin: 0 0 2px; }
  .login-caixa .sub { color: var(--apagado); font-size: 13px; margin-bottom: 26px; }
  .login-caixa input { text-align: center; }
  .rodape { text-align: center; font-size: 11px; color: #6b5384; padding: 26px 0 12px; }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="telaLogin">
  <div class="login-caixa">
    <img class="logo" src="logo-AMB.png" alt="AMBTotal Devolucoes">
    <h1>Devolucoes</h1>
    <div class="sub">triagem do galpao &middot; AMBTotal</div>
    <input class="campo" id="usuario" placeholder="usuario"
           autocapitalize="off" autocorrect="off" autocomplete="username">
    <input class="campo" id="senha" type="password" placeholder="senha" autocomplete="current-password">
    <button class="btn" id="btnEntrar">Entrar</button>
    <div class="aviso erro esconde" id="erroLogin"></div>
  </div>
  <div class="rodape">AMBTotal &middot; sistema interno</div>
</div>

<!-- ===================== APP ===================== -->
<div id="telaApp" class="esconde">
  <div class="topo">
    <img src="icone-AMB.png" alt="">
    <div class="titulo"><b>Devolucoes</b><span>AMBTotal</span></div>
    <a href="/amb/painel" style="color:var(--apagado);font-size:13px;text-decoration:none;padding:6px">painel</a>
    <span class="quem" id="quemSou"></span>
    <button class="sair" id="btnSair">sair</button>
  </div>

  <div class="area">
    <div class="colunas">
      <!-- BIPE -->
      <div id="blocoBipe">
        <input class="campo bipe" id="codigo" placeholder="bipe ou digite"
               autocapitalize="characters" autocorrect="off" autocomplete="off" enterkeyhint="search">
        <button class="btn" id="btnBuscar">Buscar</button>
        <button class="btn roxo" id="btnCamera">Usar a camera</button>
        <button class="btn cinza" id="btnOcr">Ler o NOME pela camera (OCR)</button>
        <video id="camera" class="esconde" playsinline muted></video>
        <div class="aviso">
          Bipe a etiqueta, ou digite o <b>nome do remetente</b> quando a caixa
          nao tiver codigo conhecido (TikTok, Amazon).
        </div>
      </div>

      <!-- RESULTADO -->
      <div id="resultado"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   Estado e utilidades
   ========================================================= */
const API = '/amb';
let usuario = null, tipoUsuario = null;
let ultimoCodigo = '';
let paginaAtual = 1;

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? '' : t)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

async function api(caminho, opcoes = {}) {
  const r = await fetch(API + caminho, {
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    ...opcoes,
  });
  // Sessao caiu (o servico reinicia e desloga todo mundo):
  // volta pro login em vez de mostrar erro tecnico.
  if (r.status === 401) { mostrarLogin(); throw new Error('sessao'); }
  return r.json();
}

/* =========================================================
   Login
   ========================================================= */
function mostrarLogin() {
  $('telaApp').classList.add('esconde');
  $('telaLogin').classList.remove('esconde');
}
function mostrarApp() {
  $('telaLogin').classList.add('esconde');
  $('telaApp').classList.remove('esconde');
  $('quemSou').textContent = usuario + (tipoUsuario === 'admin' ? ' \u00b7 admin' : '');
  $('codigo').focus();
}

async function entrar() {
  const u = $('usuario').value.trim();
  const s = $('senha').value;
  if (!u || !s) return;
  $('btnEntrar').disabled = true;
  $('erroLogin').classList.add('esconde');
  try {
    const r = await fetch(API + '/api/auth/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario: u, senha: s }),
    }).then(x => x.json());
    if (!r.ok) {
      $('erroLogin').textContent = r.erro || 'nao consegui entrar';
      $('erroLogin').classList.remove('esconde');
      return;
    }
    usuario = r.usuario; tipoUsuario = r.tipo;
    $('senha').value = '';
    mostrarApp();
  } catch (e) {
    $('erroLogin').textContent = 'sem conexao com o servidor';
    $('erroLogin').classList.remove('esconde');
  } finally {
    $('btnEntrar').disabled = false;
  }
}

async function sair() {
  try { await fetch(API + '/api/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
  usuario = null; limpar(); mostrarLogin();
}

/* =========================================================
   Busca / identificacao
   ========================================================= */
function limpar() {
  $('resultado').innerHTML = '';
  paginaAtual = 1;
}

async function buscar(pagina) {
  const codigo = $('codigo').value.trim();
  if (!codigo) return;
  ultimoCodigo = codigo;
  paginaAtual = pagina || 1;

  $('btnBuscar').disabled = true;
  $('resultado').innerHTML = '<div class="card">procurando...</div>';
  try {
    const r = await api('/api/triagem/identificar?codigo=' +
      encodeURIComponent(codigo) + '&pagina=' + paginaAtual);
    desenhar(r);
  } catch (e) {
    if (e.message !== 'sessao') {
      $('resultado').innerHTML = '<div class="alerta vermelho">sem conexao. tente de novo.</div>';
    }
  } finally {
    $('btnBuscar').disabled = false;
  }
}

function desenhar(r) {
  let h = '';

  /* RECADO primeiro, sempre. O aviso tem que chegar ANTES de o
     estoquista mexer na caixa — depois nao adianta. */
  if (r.recado) {
    h += '<div class="alerta vermelho"><b>&#9888;&#65039; RECADO PARA VOCE</b>' +
         esc(r.recado.texto) + '</div>';
  }

  /* Ja triado: evita registrar a mesma caixa duas vezes. */
  if (r.ja_triado && r.triagem_anterior) {
    const t = r.triagem_anterior;
    h += '<div class="alerta amarelo"><b>&#9888;&#65039; ESTA CAIXA JA FOI TRIADA</b>' +
         'por ' + esc(t.funcionario || '?') + ' em ' +
         esc(String(t.criado_em || '').slice(0, 16).replace('T', ' ')) +
         ' &middot; status ' + esc(t.status || '?') + '</div>';
  }

  if (!r.encontrado) {
    h += '<div class="alerta azul"><b>Nao identifiquei esta caixa</b>' +
         'Ja tentei: ' + (r.tentativas || []).map(t => esc(t.via)).join(', ') + '.<br><br>' +
         'Se a etiqueta for de TikTok ou Amazon, digite o <b>nome do remetente</b> ' +
         'exatamente como esta impresso.</div>' +
         '<button class="btn cinza" onclick="limpar()">Limpar</button>';
    $('resultado').innerHTML = h;
    return;
  }

  /* MOTIVO da devolucao — a informacao que muda o que o
     estoquista faz com a caixa. Vem colorido do servidor. */
  if (r.motivo_devolucao) {
    const m = r.motivo_devolucao;
    h += '<div class="alerta" style="border-color:' + esc(m.cor || '#616161') +
         ';background:rgba(255,255,255,.05)"><b>' + esc(m.titulo) + '</b>' + esc(m.detalhe || '') +
         ((m.pontos_do_mediador || []).length
           ? '<br><br>' + m.pontos_do_mediador.map(x => '&bull; ' + esc(x)).join('<br>') : '') +
         (m.sem_custo_pra_voce ? '<br><br>&#128176; O ML disse que <b>voce nao paga nada</b> neste caso.' : '') +
         (m.pacote_consolidado ? '<br>&#128230; Pacote CONSOLIDADO: pode ter mais de uma devolucao dentro.' : '') +
         '</div>';
  }
  if (r.nf_devolucao && r.nf_devolucao.emitida) {
    h += '<div class="alerta azul"><b>&#9989; NF de devolucao JA EMITIDA</b>' +
         (r.nf_devolucao.nf ? 'Nota ' + esc(r.nf_devolucao.nf.numero) + ' de ' +
           esc(String(r.nf_devolucao.nf.dataEmissao || '').slice(0, 10)) : '') +
         ' &mdash; nao precisa emitir de novo.</div>';
  }
  if (r.reclamacao) {
    h += '<a class="btn roxo" style="display:block;text-align:center;text-decoration:none" ' +
         'href="' + esc(r.reclamacao.url) + '" target="_blank" rel="noopener">' +
         esc(r.reclamacao.rotulo) + '</a>';
    if (r.reclamacao.copiar) {
      h += '<button class="btn cinza" onclick="navigator.clipboard.writeText(\'' + esc(r.reclamacao.copiar) +
           '\');this.textContent=\'copiado!\'">copiar ' + esc(r.reclamacao.copiar) + '</button>';
    }
  }

  /* Devolucao SHOPEE identificada pelo proxy */
  if (r.devolucao_shopee) {
    const ds = r.devolucao_shopee;
    h += '<div class="card"><h2>Devolucao identificada ' +
         '<span class="selo shopee">Shopee</span></h2>' +
         linha('Pedido', ds.pedido) +
         linha('Solicitacao', ds.return_sn) +
         linha('Rastreio', ds.tracking) +
         linha('Status', ds.status) + '</div>';
    h += botoesConfirmar({ marketplace: 'shopee', order_id: ds.pedido, tracking: ds.tracking });
    $('resultado').innerHTML = h;
    return;
  }

  /* Achou pelo rastreio do ML: e certeza, nao candidato. */
  if (r.devolucao) {
    const d = r.devolucao;
    h += '<div class="card"><h2>Devolucao identificada ' +
         '<span class="selo ' + esc(r.marketplace) + '">' + esc(r.marketplace_nome) + '</span></h2>' +
         linha('Pedido', d.order_id) +
         linha('Rastreio', d.tracking) +
         linha('Status do envio', d.status_devolucao) +
         linha('Dinheiro', d.status_money === 'refunded' ? 'ja estornado ao cliente'
               : (d.status_money === 'retained' ? 'retido com voce' : d.status_money)) +
         '</div>';
    h += botoesConfirmar({
      marketplace: r.marketplace, order_id: d.order_id, tracking: d.tracking,
      shipment_id: d.shipment_devolucao,
    });
    $('resultado').innerHTML = h;
    return;
  }

  /* Achou por nome: sao CANDIDATOS, quem decide e o estoquista. */
  if (r.busca_generica) {
    h += '<div class="alerta amarelo"><b>Busca muito ampla</b>' +
         r.total_encontrados + ' notas tem esse texto no nome. ' +
         'Digite o <b>nome completo</b> do remetente que esta na etiqueta.</div>';
  }

  h += '<div class="card"><h2>' + r.total_encontrados +
       ' nota(s) &middot; mostrando ' + r.candidatos.length + '</h2>' +
       '<div class="aviso" style="margin:0">Confira com a caixa antes de confirmar. ' +
       (r.mesmo_cliente_repetido
         ? 'Todas sao do <b>mesmo cliente</b> &mdash; use "ver itens" para achar a certa.'
         : '') + '</div></div>';

  r.candidatos.forEach((c, i) => {
    h += '<div class="cand">' +
         '<div class="nome">' + esc(c.nome) + '</div>' +
         '<div class="meta">NF ' + esc(c.numero) + ' &middot; ' +
         esc(String(c.dataEmissao || '').slice(0, 10)) + '</div>' +
         '<div class="acoes">' +
         '<button class="btn peq roxo" onclick="verItens(' + i + ',\'' + esc(c.id) + '\')">ver itens</button>' +
         '<button class="btn peq" onclick="escolher(' + i + ',\'' + esc(c.id) + '\',\'' + esc(c.numero) + '\',\'' + esc(c.nome) + '\')">e esta</button>' +
         '</div><div class="itens esconde" id="itens' + i + '"></div></div>';
  });

  if (r.tem_mais)     h += '<button class="btn cinza" onclick="buscar(' + (paginaAtual + 1) + ')">Ver mais 8</button>';
  if (paginaAtual > 1) h += '<button class="btn cinza" onclick="buscar(' + (paginaAtual - 1) + ')">Voltar</button>';
  h += '<button class="btn cinza" onclick="limpar()">Limpar</button>';
  $('resultado').innerHTML = h;
}

function linha(rot, val) {
  if (val == null || val === '') return '';
  return '<div class="linha"><span class="rot">' + esc(rot) +
         '</span><span class="val">' + esc(val) + '</span></div>';
}

/* Itens sob demanda: uma chamada, so quando o estoquista clica.
   Trazer os 8 de uma vez custaria 8 chamadas ao Bling por busca. */
async function verItens(i, id) {
  const alvo = $('itens' + i);
  if (!alvo.classList.contains('esconde')) { alvo.classList.add('esconde'); return; }
  alvo.classList.remove('esconde');
  alvo.innerHTML = 'buscando...';
  try {
    const r = await api('/api/nf/itens?id=' + encodeURIComponent(id));
    if (!r.ok) { alvo.innerHTML = '<span class="erro">' + esc(r.erro) + '</span>'; return; }
    let h = '';
    if (r.marketplace && r.marketplace !== 'desconhecido') {
      h += '<div style="margin-bottom:6px"><span class="selo ' + esc(r.marketplace) + '">' +
           esc(r.marketplace_nome) + '</span></div>';
    }
    (r.itens || []).forEach(it => {
      h += '<div>' + esc(it.quantidade) + 'x <b>' + esc(it.sku) + '</b> &mdash; ' +
           esc(String(it.descricao || '').slice(0, 60)) + '</div>';
    });
    if (r.nf && r.nf.valor != null) h += '<div style="color:var(--apagado)">total da nota: R$ ' + esc(r.nf.valor) + '</div>';
    alvo.innerHTML = h || 'nota sem itens';
    alvo.dataset.marketplace = r.marketplace || '';
    alvo.dataset.sku = (r.itens && r.itens[0] && r.itens[0].sku) || '';
    alvo.dataset.valor = (r.nf && r.nf.valor) || '';
  } catch (e) {
    if (e.message !== 'sessao') alvo.innerHTML = '<span class="erro">falhou</span>';
  }
}

function escolher(i, id, numero, nome) {
  const cx = $('itens' + i);
  const dados = {
    nf_id_bling: id, nf_numero: numero, buyer_nome: nome,
    marketplace: (cx && cx.dataset.marketplace) || null,
    produto_sku: (cx && cx.dataset.sku) || null,
    nf_valor: (cx && cx.dataset.valor) || null,
  };
  $('resultado').innerHTML =
    '<div class="card"><h2>Confirmar</h2>' +
    linha('Cliente', nome) + linha('NF', numero) +
    (dados.produto_sku ? linha('SKU', dados.produto_sku) : '') +
    '</div>' + botoesConfirmar(dados);
  window.scrollTo(0, 0);
}

function botoesConfirmar(dados) {
  window._paraGravar = dados;
  return '<button class="btn verde" onclick="gravar(\'aprovado\')">Incluir no estoque</button>' +
         '<button class="btn verm" onclick="gravar(\'problema\')">Reportar problema</button>' +
         '<button class="btn cinza" onclick="limpar()">Cancelar</button>';
}

async function gravar(status) {
  const d = Object.assign({}, window._paraGravar || {}, { status, tipo: 'devolucao' });
  if (status === 'problema') {
    const desc = prompt('O que houve com o produto?');
    if (!desc) return;
    d.problema_descricao = desc;
    // Localizacao e quantidade sao o que permite ACHAR a peca
    // depois no galpao — sem isso o defeito vira um numero solto.
    d.localizacao = prompt('Onde voce vai guardar? (ex: prateleira D3)') || null;
    d.defeito_qtd = Number(prompt('Quantas unidades com defeito?', '1') || 1);
  }
  try {
    const r = await api('/api/triagem/registrar', { method: 'POST', body: JSON.stringify(d) });
    if (!r.ok) {
      $('resultado').innerHTML = '<div class="alerta vermelho"><b>Nao gravou</b>' +
        esc(r.erro) + '</div>' + botoesConfirmar(d);
      return;
    }
    let fim = '<div class="alerta azul"><b class="ok">&#10003; Registrado</b>' +
      (status === 'problema'
        ? 'Marcado como problema.' + (r.email_enviado ? ' O Diego foi avisado por e-mail.' : '')
        : 'Pode incluir no estoque.') + '</div>';

    /* CANIBALIZACAO: ja existem outras unidades do mesmo SKU
       quebradas — da pra tirar peca de uma pra salvar outra. */
    if (r.canibalizacao) {
      fim += '<div class="alerta amarelo"><b>&#128295; Tem mais ' + r.canibalizacao.outras_unidades +
        ' unidade(s) deste SKU em defeito</b>' +
        (r.canibalizacao.locais.length ? 'Guardadas em: ' + r.canibalizacao.locais.map(esc).join(', ') + '. ' : '') +
        'Antes de descartar, veja se uma completa a outra.</div>';
    }
    if (status === 'problema' && d.produto_sku) {
      window._ultimoDefeito = d;
      fim += '<button class="btn roxo" onclick="imprimirEtiqueta()">&#127991; Imprimir etiqueta de defeito</button>';
    }
    fim += '<button class="btn" onclick="proxima()">Proxima caixa</button>';
    $('resultado').innerHTML = fim;
    window.scrollTo(0, 0);
  } catch (e) {
    if (e.message !== 'sessao') {
      $('resultado').innerHTML = '<div class="alerta vermelho">sem conexao &mdash; NAO gravou. tente de novo.</div>' +
        botoesConfirmar(d);
    }
  }
}

function proxima() {
  $('codigo').value = '';
  limpar();
  $('codigo').focus();
}

/* Etiqueta de defeito: enfileira; a Zebra imprime na estacao
   (o painel aberto num PC com QZ Tray). */
async function imprimirEtiqueta() {
  const d = window._ultimoDefeito || {};
  try {
    const r = await api('/api/etiqueta/fila', { method: 'POST', body: JSON.stringify({
      sku: d.produto_sku, defeito: d.problema_descricao,
      localizacao: d.localizacao, nf: d.nf_numero,
    }) });
    alert(r.ok
      ? (r.estacao_ativa ? 'Na fila - vai sair na Zebra.' : 'Na fila, mas ' + (r.aviso || 'nenhuma estacao ativa'))
      : 'Falhou: ' + r.erro);
  } catch (e) { alert('Sem conexao - tente de novo.'); }
}

/* =========================================================
   OCR do NOME do remetente — o caminho pro TikTok/Amazon.
   O Tesseract roda NO CELULAR (nada sobe pra servidor) e so
   e baixado quando o estoquista pede — o fluxo normal continua
   funcionando sem nenhum CDN.
   ========================================================= */
let ocrPronto = false;
function carregarTesseract() {
  return new Promise((res, rej) => {
    if (ocrPronto || window.Tesseract) { ocrPronto = true; return res(); }
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    sc.onload = () => { ocrPronto = true; res(); };
    sc.onerror = () => rej(new Error('sem internet pra baixar o leitor'));
    document.head.appendChild(sc);
  });
}

async function lerNomeOCR() {
  const btn = $('btnOcr');
  btn.disabled = true; btn.textContent = 'preparando o leitor...';
  try {
    await carregarTesseract();
    // abre a camera e captura UM quadro apontado pro bloco REMETENTE
    const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } } });
    const v = $('camera');
    v.srcObject = st; v.classList.remove('esconde'); await v.play();
    btn.textContent = 'aponte pro REMETENTE e toque no video';
    await new Promise(res => { v.onclick = res; });
    const cv = document.createElement('canvas');
    cv.width = v.videoWidth; cv.height = v.videoHeight;
    cv.getContext('2d').drawImage(v, 0, 0);
    st.getTracks().forEach(t => t.stop());
    v.classList.add('esconde'); v.onclick = null;

    btn.textContent = 'lendo...';
    const { data } = await Tesseract.recognize(cv, 'por');
    // pega a linha mais parecida com nome: só letras/espaco, 2+ palavras
    const linhas = String(data.text || '').split('\n').map(x => x.trim())
      .filter(x => /^[A-Za-zÀ-ÿ ]{8,}$/.test(x) && x.split(/\s+/).length >= 2)
      .sort((a, b) => b.length - a.length);
    if (!linhas.length) { alert('Nao achei um nome na foto. Aproxime do bloco REMETENTE e tente de novo.'); return; }
    $('codigo').value = linhas[0];
    buscar(1);
  } catch (e) {
    alert('OCR falhou: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Ler o NOME pela camera (OCR)';
  }
}

/* =========================================================
   Camera (usa o leitor nativo do proprio celular)
   ========================================================= */
let stream = null, lendo = false;
async function camera() {
  if (stream) { pararCamera(); return; }
  if (!('BarcodeDetector' in window)) {
    alert('Este celular nao tem leitor nativo de codigo de barras. Use o teclado.');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = $('camera');
    v.srcObject = stream; v.classList.remove('esconde'); await v.play();
    const det = new BarcodeDetector();
    lendo = true;
    const loop = async () => {
      if (!lendo) return;
      try {
        const cods = await det.detect(v);
        if (cods && cods.length) {
          $('codigo').value = cods[0].rawValue;
          pararCamera();
          buscar(1);
          return;
        }
      } catch (e) { /* quadro ruim: tenta o proximo */ }
      requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {
    alert('Nao consegui abrir a camera: ' + e.message);
  }
}
function pararCamera() {
  lendo = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $('camera').classList.add('esconde');
}

/* =========================================================
   Ligacoes
   ========================================================= */
$('btnEntrar').onclick = entrar;
$('senha').onkeydown   = (e) => { if (e.key === 'Enter') entrar(); };
$('usuario').onkeydown = (e) => { if (e.key === 'Enter') $('senha').focus(); };
$('btnBuscar').onclick = () => buscar(1);
$('codigo').onkeydown  = (e) => { if (e.key === 'Enter') buscar(1); };
$('btnCamera').onclick = camera;
$('btnOcr').onclick    = lerNomeOCR;
$('btnSair').onclick   = sair;

/* Ao abrir: se ja houver sessao valida, entra direto. */
(async () => {
  try {
    const r = await fetch(API + '/api/auth/me', { credentials: 'same-origin' }).then(x => x.json());
    if (r.ok) { usuario = r.usuario; tipoUsuario = r.tipo; mostrarApp(); return; }
  } catch (e) {}
  mostrarLogin();
})();
